name: Publier sur PyPI

# Se déclenche uniquement quand tu crées une « étiquette » de version, par exemple v1.0.1.
on:
  push:
    tags:
      - "v*"

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Vérifier que les tests passent
        run: python -m unittest discover -s tests -t .
      - name: Construire le paquet
        run: |
          python -m pip install build
          python -m build
      - name: Garder les fichiers construits
        uses: actions/upload-artifact@v5
        with:
          name: paquet
          path: dist/

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: pypi          # doit exister dans GitHub : Settings > Environments
    permissions:
      id-token: write          # permet la « publication de confiance » : aucun mot de passe à stocker
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: paquet
          path: dist/
      - name: Envoyer sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
